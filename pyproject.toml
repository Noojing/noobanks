[project]
name = "noobanks"
version = "0.1.0"
description = "Automated pipeline for fetching, parsing, and AI-extracting structured metrics from global bank financial reports"
readme = "README.md"
authors = [
    { name = "Zev Fu", email = "zev.fu@noojing.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.10",
    "anthropic>=0.122.0",
    "beautifulsoup4>=4.12",
    "ddgs>=9.14.4",
    "lxml>=5.3",
    "pydantic>=2.10",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "pyyaml>=6.0",
    "rich>=13.9",
    "tenacity>=9.0",
    "tiktoken>=0.13.0",
    "typer>=0.15",
]

[project.scripts]
noobanks = "noobanks:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.15.1",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
